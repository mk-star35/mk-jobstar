<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobStar</title>
<style>
body{margin:0;background:#10131a;color:#eef3fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:980px;margin:auto;padding:28px 18px 64px}.hero,.card{background:#1a2030;border:1px solid #30394d;border-radius:18px;padding:18px;margin:14px 0}h1{margin:0 0 8px;font-size:30px}h2{margin:0 0 12px;font-size:19px}.sub,.meta{color:#aeb8cc;line-height:1.5}input,textarea{width:100%;box-sizing:border-box;border:1px solid #3c465d;background:#0e1420;color:#eef3fb;border-radius:12px;padding:12px;margin:6px 0 10px}textarea{min-height:220px;resize:vertical}button{border:0;border-radius:12px;background:#3d7eff;color:white;padding:11px 15px;font-weight:800;cursor:pointer;margin:2px}.item{border-top:1px solid #30394d;padding:12px 0}.item:first-child{border-top:0}.score{color:#ffd36f;font-weight:800}.good{color:#9ee6a3}.risk{color:#ffb3a7}.advice{color:#d9e4ff;margin-top:5px}.question{color:#cdb8ff;margin-top:5px}.pill{display:inline-block;border:1px solid #3c465d;border-radius:999px;padding:4px 9px;margin:3px 4px 3px 0;color:#cdd6e8;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secondary{background:#2b3344}.tiny{font-size:13px;color:#aeb8cc}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>JobStar</h1><p class="sub">채용 알림 메일을 붙여넣으면 공고를 추출하고, 선호·회피 조건 기준으로 오늘 볼 만한 TOP 5를 골라줍니다.</p></section>
<section class="card"><h2>1) 내 조건</h2><div class="grid"><div><label>선호조건</label><input id="prefer" value="FP&A, 재무기획, 경영관리, 연결회계, 자금관리, 금융, 핀테크, Finance, Accounting Manager, AI"></div><div><label>회피조건</label><input id="avoid" value="기장, 종합소득세, 일반전표, 아르바이트, 일반사무, 총무, 인사, 법무"></div></div><p class="tiny">현재는 규칙 기반 MVP입니다. 나중에 사주/점성술 성향 프로필을 추가해 점수와 조언을 더 개인화할 수 있습니다.</p></section>
<section class="card"><h2>2) 메일 본문 붙여넣기</h2><textarea id="mail" placeholder="사람인 또는 LinkedIn 채용 알림 메일 본문을 붙여넣으세요."></textarea><button id="go">분석하기</button><button id="sampleSaramin" class="secondary">사람인 샘플</button><button id="sampleLinkedin" class="secondary">LinkedIn 샘플</button></section>
<section class="card"><h2>3) 추출된 공고 미리보기</h2><div id="preview" class="sub">아직 추출된 공고가 없습니다.</div></section>
<section class="card"><h2>4) 오늘 볼 만한 공고 TOP 5</h2><div id="result" class="sub">분석 결과가 여기에 표시됩니다.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const arr=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);
const strongGood=['FP&A','재무기획','Finance','Accounting Manager','연결회계','자금관리','자회사','리스크','컨설팅','상장사','AI','핀테크'];
const softGood=['경영관리','재무회계','회계 관리자','회계팀','재무팀','경영지원','회계자금'];
const sectorGood=['저축은행','증권','은행','페이','테크','웹툰','바이오','플랫폼','Superb AI','EY'];
const strongRisk=['인재Pool','인재풀','Talent Pool','talent pool','아르바이트','알바','종합소득세','일반전표','전표','세무사무소','세무회계사무소','기장','신고'];
const weakRisk=['일반사무','총무','인사','법무','식음','조리','디자인','영업','마케팅','물류','CX','AS'];
const vague=['각 부문','부문별','공개 채용','정기 채용','신입/경력','수시채용','인재채용'];
function clean(t){return t.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/(입사지원|하러가기|더보기|Copyright|대표|주소|모두 보기|알림 설정|실시간 공고|홈 바로가기|받지않기|프리미엄|Messaging icon|Notifications icon)/i.test(x))}
function kind(t){if(/linkedin|채용공고 알림/i.test(t))return['LinkedIn','링크드인형'];if(/오늘의 공채 소식|직무 맞춤 공채/.test(t))return['사람인','공채형'];if(/저장한 검색 조건/.test(t))return['사람인','저장검색형'];if(/추천공고|오늘의 추천|최근 활동/.test(t))return['사람인','추천형'];return['기타','기타']}
function cd(line){let m=line.match(/^(.*?)(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시|\d{2}\/\d{2}|마감\s*\d+일\s*전)$/);return m?{company:m[1].trim(),deadline:m[2].trim()}:{company:line,deadline:''}}
function sectionOf(line,current){if(/직무 맞춤/.test(line))return'직무 맞춤 공채 공고 추천';if(/연봉 TOP/.test(line))return'연봉 TOP 30% 공고';if(/조회수 높은/.test(line))return'조회수 높은 공고';if(/워라밸 좋은/.test(line))return'워라밸 좋은 회사';if(/오늘의 추천/.test(line))return'오늘의 추천';if(/지금 가장 인기/.test(line))return current;return null}
function parse(t){let [platform,type]=kind(t),lines=clean(t),jobs=[],section='';if(platform==='LinkedIn'){for(let i=0;i<lines.length-2;i++){let c=lines[i],title=lines[i+1],meta=lines[i+2];if(meta.startsWith(c+' ·')){let info=meta.replace(c+' ·',''),w=(info.match(/\((.*?)\)/)||[])[1]||'',loc=info.replace(/\(.*?\)/,'').trim();jobs.push({platform,type,section,company:c,title,deadline:'',location:loc,work:w})}}}else{for(let i=0;i<lines.length;i++){let line=lines[i],sec=sectionOf(line,section);if(sec!==null){section=sec;continue}let one=line.match(/^(.*?)\s+-\s+(.*?)\s+(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시)$/);if(one){jobs.push({platform,type,section,company:one[1].trim(),title:one[2].trim(),deadline:one[3].trim()});continue}if(/(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시|\d{2}\/\d{2}|마감\s*\d+일\s*전)$/.test(line)){let x=cd(line),title=lines[i+1]||'';if(title&&!/(추천공고|공채 소식|최근 활동|더 많은 공고)/.test(x.company+title))jobs.push({platform,type,section,company:x.company,title,deadline:x.deadline})}}}let map=new Map();jobs.forEach(j=>{if(j.company&&j.title)map.set((j.company+'::'+j.title).toLowerCase(),j)});return[...map.values()]}
function hit(text,list){return list.filter(w=>text.includes(w.toLowerCase()))}
function advice(j,talent,sg,soft,sec,risks,vg){let a=[],q=[];if(talent){a.push('실제 채용 공고라기보다 후보자 풀 등록 성격이 강해 보여요. 오늘 바로 지원할 공고에서는 제외하고 관심 회사 저장용으로만 보는 편이 좋아요.');q.push('현재 실제로 오픈된 포지션이 있는지 먼저 확인하세요.');return{a,q}}if(sg.some(x=>['FP&A','재무기획','Finance','Accounting Manager'].includes(x))||soft.some(x=>['경영관리','경영지원','회계자금'].includes(x))){a.push('분석·기획·의사결정 지원 업무로 확장될 가능성이 있어 우선 확인할 만해요.');q.push('예산·손익 분석, 경영진 리포트, 데이터 기반 의사결정 지원 업무가 실제로 있는지 확인하세요.')}if(soft.some(x=>['재무회계','회계팀','회계 관리자'].includes(x))){a.push('기존 회계 경력과 연결되지만 반복 결산·전표·세무 중심일 수 있어 업무 범위 확인이 필요해요.');q.push('월마감·결산 비중과 업무 개선/자동화 권한이 있는지 물어보세요.')}if(sec.length){a.push('관심 산업과 연결될 수 있지만 회사마다 재무팀 역할과 조직문화 차이가 커요.');q.push('재무팀이 단순 운영 조직인지, 사업부 지표를 함께 보고 개선안을 내는 구조인지 확인하세요.')}if(vg.length){a.push('여러 직무를 한 번에 묶은 공고라 실제 재무 포지션 비중이 불명확해요.');q.push('재무회계 포지션이 별도 TO인지, 담당 업무가 무엇인지 먼저 확인하세요.')}if(risks.length){a.push('회피 키워드가 있어 반복·지원성 업무 비중이 높을 수 있어요.');q.push('비재무 업무 또는 단순 입력 업무 비중이 어느 정도인지 확인하세요.')}if(!a.length){a.push('공고 제목만으로는 적합도를 판단하기 어려워요. 상세 공고 확인 전 우선순위는 낮게 보는 게 좋아요.');q.push('상세 업무 내용에 재무기획·분석·개선 업무가 있는지 확인하세요.')}return{a:[...new Set(a)],q:[...new Set(q)]}}
function score(j){let s=34,good=[],risk=[],text=(j.company+' '+j.title+' '+j.section).toLowerCase();let talent=/(인재pool|인재풀|talent pool)/i.test(text);let sg=hit(text,strongGood),soft=hit(text,softGood),sec=hit(text,sectorGood),vg=hit(text,vague);sg.forEach(w=>{s+=17;good.push('강한 적합: '+w)});soft.forEach(w=>{s+=10;good.push('관련 키워드: '+w)});sec.forEach(w=>{s+=5;good.push('산업/회사 힌트: '+w)});arr('prefer').forEach(w=>{if(w&&!good.join(' ').toLowerCase().includes(w.toLowerCase())&&text.includes(w.toLowerCase())){s+=8;good.push('선호조건: '+w)}});hit(text,strongRisk).forEach(w=>{s-=25;risk.push('강한 회피: '+w)});hit(text,weakRisk).forEach(w=>{s-=13;risk.push('주의: '+w)});arr('avoid').forEach(w=>{if(w&&!risk.join(' ').toLowerCase().includes(w.toLowerCase())&&text.includes(w.toLowerCase())){s-=12;risk.push('회피조건: '+w)}});if(talent){s-=30;risk.push('인재Pool은 실제 채용 중인 특정 포지션이 아닐 가능성이 높아 오늘의 지원 우선순위에서는 제외 권장');good.push('관심 회사 저장용으로만 참고')}if(vg.length){let hasFit=sg.length+soft.length+sec.length>0;s-=hasFit?4:12;risk.push(hasFit?'통합공고라 실제 담당업무 확인 필요':'직무 정보가 넓어 적합도 확인 필요')}if(j.section==='워라밸 좋은 회사'){s+=5;good.push('워라밸 섹션')}if(j.section==='조회수 높은 공고'){s+=2;good.push('조회수 높은 공고')}if(!good.length){s-=5;risk.push('추천 근거가 부족함')}let adv=advice(j,talent,sg,soft,sec,risk,vg);return{...j,score:Math.max(0,Math.min(100,s)),good:[...new Set(good)],risk:[...new Set(risk)],advice:adv.a,questions:adv.q}}
function render(){let jobs=parse($('mail').value);$('preview').innerHTML=jobs.length?`<p><span class="pill">추출 ${jobs.length}개</span></p>`+jobs.map((j,i)=>`<div class="item"><b>${i+1}. ${j.company}</b> · ${j.title}<div class="meta">${j.platform} / ${j.type} / ${j.section||'-'} / ${j.deadline||'-'} ${j.location||''} ${j.work||''}</div></div>`).join(''):'공고를 찾지 못했습니다.';let top=jobs.map(score).sort((a,b)=>b.score-a.score).slice(0,5);$('result').innerHTML=top.length?top.map((j,i)=>`<div class="item"><b>TOP ${i+1}. ${j.company}</b> · ${j.title}<div class="score">점수 ${j.score}</div><div class="good">추천 이유: ${j.good.length?j.good.join(' / '):'기본 점수'}</div><div class="risk">확인 필요: ${j.risk.length?j.risk.join(' / '):'뚜렷한 위험 신호 없음'}</div><div class="advice">조언: ${j.advice.join(' ')}</div><div class="question">면접/지원 전 질문: ${j.questions.join(' / ')}</div></div>`).join(''):'추천할 공고가 없습니다.'}
$('go').onclick=render;
$('sampleSaramin').onclick=()=>{$('mail').value=`김민정님을 위한 오늘의 공채 소식\n직무 맞춤 공채 공고 추천\n동원제일저축은행 ~2026-04-16\n2026년 상반기 동원제일저축은행 공개 채용\n(주)모빌테크 ~2026-04-20\n분야별 공개 채용 (재무회계, 연구개발, 웹서비스개발, 센서데이터팀)\n조회수 높은 공고\n네이버웹툰(유) - 네이버웹툰(유) 경력 경영지원 직군 인재Pool(Finance) ~2026-04-30\n워라밸 좋은 회사\n(주)엘앤씨바이오 - [L&C BIO] 경영관리팀 회계 관리자(경력) 채용 ~채용시\n세무회계 한영 - 종합소득세 신고 알바 모집합니다. ~2026-04-22`;render()};
$('sampleLinkedin').onclick=()=>{$('mail').value=`회계 과장 채용공고 알림\n\nSuperb AI Inc.\nAccounting Manager\nSuperb AI Inc. · 서울, 대한민국(대면근무)\n\nEY\nFinance 회계자금 경력직\nEY · 서울, 대한민국(대면근무)\n\n모두 보기\n알림 설정`;render()};
</script>
</body>
</html>
