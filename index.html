<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사람인 메일 공고 정리기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F7F8FC;color:#1F2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1040px;margin:auto;padding:36px 20px 72px}.hero{background:linear-gradient(135deg,#fff,#EEF3FF);border:1px solid #E5E7EB;border-radius:24px;padding:28px;box-shadow:0 12px 34px rgba(31,41,55,.06)}.card{background:#fff;border:1px solid #E5E7EB;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 10px 24px rgba(31,41,55,.05)}h1{margin:0 0 10px;font-size:32px;letter-spacing:-.03em}h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 10px;font-size:18px}.sub,.meta{color:#6B7280;line-height:1.6}label{display:block;margin-top:10px;color:#374151;font-weight:700;font-size:14px}input,textarea{width:100%;border:1px solid #E5E7EB;background:#fff;color:#1F2937;border-radius:14px;padding:13px 14px;margin:7px 0 12px;font-size:14px}textarea{min-height:190px;resize:vertical;line-height:1.55}button{border:0;border-radius:14px;background:#4F6EF7;color:white;padding:12px 17px;font-weight:800;cursor:pointer;margin:2px}.secondary{background:#EEF3FF;color:#4F6EF7}.item{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:15px;margin:10px 0}.score{color:#4F6EF7;font-weight:800}.good{color:#167A45;margin-top:6px}.risk{color:#B42318;margin-top:6px}.advice{color:#374151;margin-top:6px}.question{color:#4F46E5;margin-top:6px}.pill{display:inline-block;border:1px solid #E5E7EB;background:#F7F8FC;border-radius:999px;padding:5px 10px;margin:3px 4px 3px 0;color:#6B7280;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tiny{font-size:13px;color:#6B7280}.bucket{border-radius:20px;padding:16px;margin:16px 0}.bucket.today{background:#E8F7EE}.bucket.keep{background:#FFF7E8}.bucket.drop{background:#FDEDED}.bucket h3{margin-top:0}.preview-list .item{box-shadow:none}.empty{color:#6B7280}@media(max-width:760px){main{padding:24px 14px 54px}.grid{grid-template-columns:1fr}h1{font-size:27px}.hero,.card{padding:18px;border-radius:18px}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>사람인 메일 공고 정리기</h1><p class="sub">채용 메일을 붙여넣으면 볼 공고와 넘길 공고를 정리해드려요.</p></section>
<section class="card"><h2>1) 내 기준</h2><div class="grid"><div><label>보고 싶은 방향</label><input id="prefer" value="FP&A, 재무기획, 경영관리, 연결회계, 자회사, IR, 공시, 투자, 금융, 핀테크, Finance, Accounting Manager, AI"></div><div><label>피하고 싶은 방향</label><input id="avoid" value="자금, 자금관리, 자금 관리, 자금팀, 자금파트, 기장, 종합소득세, 일반전표, 아르바이트, 경리, 일반사무, 총무, 인사, 법무, 계약직"></div></div><label>참고 성향</label><input id="tendency" value="반복업무 소진, 자금업무 비선호, 데이터분석 선호, 시스템개선 선호, 보수조직 주의, 성장산업 선호"><p class="tiny">지금은 사람인 메일 정리용 MVP입니다. 성향은 공고를 나눌 때 참고 기준으로만 사용합니다.</p></section>
<section class="card"><h2>2) 사람인 메일 붙여넣기</h2><textarea id="mail" placeholder="사람인 채용 알림 메일 본문을 붙여넣으세요."></textarea><button id="go">공고 정리하기</button><button id="sampleSaramin" class="secondary">샘플 넣기</button></section>
<section class="card"><h2>3) 추출 결과</h2><div id="preview" class="sub empty">아직 추출된 공고가 없습니다.</div></section>
<section class="card"><h2>4) 추천 분류</h2><div id="result" class="sub empty">분석 결과가 여기에 표시됩니다.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const arr=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);
const strongGood=['FP&A','재무기획','Finance','Accounting Manager','연결회계','자회사','리스크','컨설팅','상장사','IR','공시','투자','경영기획','CFO'];
const softGood=['경영관리','재무회계','회계 관리자','회계팀','재무팀','경영지원','회계자금','재경팀','재무담당'];
const sectorGood=['저축은행','증권','은행','페이','테크','로보틱스','바이오','플랫폼','보험'];
const strongRisk=['인재Pool','인재풀','Talent Pool','talent pool','자금관리','자금 관리','자금팀','자금파트','아르바이트','알바','종합소득세','일반전표','전표','세무사무소','세무회계사무소','세무법인','기장','신고','경리'];
const weakRisk=['자금','일반사무','총무','인사','법무','계약직','육아휴직','식음','조리','디자인','영업','마케팅','물류','CX','AS','VAN'];
const vague=['각 부문','부문별','공개 채용','정기 채용','신입/경력','수시채용','인재채용','전부문'];
function clean(t){return t.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/(입사지원|하러가기|더보기|Copyright|대표|주소|모두 보기|알림 설정|실시간 공고|홈 바로가기|수신거부|받지않기|프리미엄|LinkedIn|제세공과금)/i.test(x))}
function kind(t){if(/linkedin|채용공고 알림/i.test(t))return['제외','LinkedIn 제외'];if(/오늘의 공채 소식|직무 맞춤 공채/.test(t))return['사람인','공채형'];if(/저장한 검색 조건/.test(t))return['사람인','저장검색형'];if(/추천공고|마감 예정 채용 공고|새로 등록된 채용공고|취업축하금/.test(t))return['사람인','추천형'];return['기타','기타']}
function cd(line){let m=line.match(/^(.*?)(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시|D-\d+|\d{2}\/\d{2}|마감\s*\d+일\s*전)$/);return m?{company:m[1].trim(),deadline:m[2].trim()}:{company:line,deadline:''}}
function sectionOf(line,current){if(/직무 맞춤/.test(line))return'직무 맞춤 공채 공고 추천';if(/연봉 TOP/.test(line))return'연봉 TOP 30% 공고';if(/조회수 높은/.test(line))return'조회수 높은 공고';if(/워라밸 좋은/.test(line))return'워라밸 좋은 회사';if(/마감 예정/.test(line))return'마감 예정 채용 공고';if(/새로 등록/.test(line))return'새로 등록된 채용공고';if(/오늘의 추천/.test(line))return'오늘의 추천';if(/지금 가장 인기/.test(line))return current;return null}
function parse(t){let [platform,type]=kind(t);if(platform==='제외')return{platform,type,jobs:[],notice:'LinkedIn 메일은 상세 정보가 부족해 1차 MVP에서는 제외했습니다. 사람인 메일을 붙여넣어 주세요.'};let lines=clean(t),jobs=[],section='';if(platform!=='사람인')return{platform,type,jobs:[],notice:'현재는 사람인 채용 알림 메일만 우선 지원합니다.'};for(let i=0;i<lines.length;i++){let line=lines[i],sec=sectionOf(line,section);if(sec!==null){section=sec;continue}let one=line.match(/^(.*?)\s+-\s+(.*?)\s+(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시|D-\d+)$/);if(one){jobs.push({platform,type,section,company:one[1].trim(),title:one[2].trim(),deadline:one[3].trim()});continue}if(/(~\d{4}-\d{2}-\d{2}|~채용시|채용시|상시|D-\d+|\d{2}\/\d{2}|마감\s*\d+일\s*전)$/.test(line)){let x=cd(line),title=lines[i+1]||'';if(title&&!/(추천공고|공채 소식|최근 활동|더 많은 공고|합격 시 취업축하금)/.test(x.company+title))jobs.push({platform,type,section,company:x.company,title,deadline:x.deadline})}}let map=new Map();jobs.forEach(j=>{if(j.company&&j.title)map.set((j.company+'::'+j.title).toLowerCase(),j)});return{platform,type,jobs:[...map.values()],notice:''}}
function hit(text,list){return list.filter(w=>text.includes(w.toLowerCase()))}
function tendencyAdvice(text){let tags=arr('tendency'),out=[];if(tags.some(x=>x.includes('자금'))&&/(자금|자금관리|자금팀|자금파트)/.test(text))out.push('자금 업무는 현재 선호 경력 방향과 거리가 있어 우선순위를 낮추는 게 좋아요.');if(tags.some(x=>x.includes('반복'))&&/(재무회계|회계|전표|기장|신고|경리)/.test(text))out.push('반복 업무 비중을 확인하는 게 좋아요.');if(tags.some(x=>x.includes('데이터'))&&/(Finance|FP&A|재무기획|경영관리|리스크|컨설팅|IR|공시)/i.test(text))out.push('분석 업무와 연결될 가능성이 있어요.');if(tags.some(x=>x.includes('시스템'))&&/(테크|플랫폼|AI|시스템|자동화|로보틱스)/i.test(text))out.push('시스템 개선 성향과 연결될 수 있어요.');if(tags.some(x=>x.includes('보수'))&&/(저축은행|은행|금융|증권|보험)/.test(text))out.push('금융권은 조직문화 확인이 필요해요.');if(tags.some(x=>x.includes('성장'))&&/(테크|로보틱스|바이오|플랫폼|AI)/i.test(text))out.push('성장 산업 선호와 맞을 수 있어요.');return out}
function advice(j,talent,sg,soft,sec,risks,vg,text){let a=[],q=[];if(talent){a.push('후보자 풀 등록 성격이 강해 보여요. 관심 회사 저장용으로만 보는 편이 좋아요.');return{a,q}}if(/자금|자금관리|자금팀|자금파트/.test(text)){a.push('자금 파트는 현재 기준에서는 우선순위를 낮추는 게 좋아요.');q.push('자금 집행 중심인지, 기획·분석과 연결되는지 확인하세요.')}if(sg.some(x=>['FP&A','재무기획','Finance','Accounting Manager','IR','공시','투자','경영기획'].includes(x))){a.push('분석·기획 업무로 확장될 가능성이 있어요.');q.push('예산·손익 분석이나 경영진 리포트 업무가 실제로 있는지 확인하세요.')}if(soft.some(x=>['재무회계','회계팀','회계 관리자','재경팀','재무담당'].includes(x))){a.push('회계 경력과 연결되지만 반복 결산 중심일 수 있어요.');q.push('월마감·결산 비중과 업무 개선 권한을 확인하세요.')}if(sec.length){a.push('회사마다 재무팀 역할 차이가 커요.');q.push('재무팀이 단순 운영 조직인지, 사업부와 지표를 함께 보는 구조인지 확인하세요.')}if(vg.length){a.push('통합공고라 실제 재무 포지션 비중이 불명확해요.');q.push('재무 포지션이 별도 TO인지 확인하세요.')}if(risks.length){a.push('회피 키워드가 있어 우선순위를 낮게 보는 게 좋아요.')}tendencyAdvice(text).forEach(x=>a.push(x));if(!a.length){a.push('공고 제목만으로는 판단하기 어려워요.');q.push('상세 업무에 재무기획·분석·개선 업무가 있는지 확인하세요.')}return{a:[...new Set(a)].slice(0,2),q:[...new Set(q)].slice(0,1)}}
function score(j){let s=34,good=[],risk=[],text=(j.company+' '+j.title+' '+j.section);let low=text.toLowerCase(),talent=/(인재pool|인재풀|talent pool)/i.test(text);let sg=hit(low,strongGood),soft=hit(low,softGood),sec=hit(low,sectorGood),vg=hit(low,vague);sg.forEach(w=>{s+=17;good.push('강한 적합: '+w)});soft.forEach(w=>{s+=10;good.push('관련 키워드: '+w)});sec.forEach(w=>{s+=5;good.push('산업 힌트: '+w)});arr('prefer').forEach(w=>{if(w&&!good.join(' ').toLowerCase().includes(w.toLowerCase())&&low.includes(w.toLowerCase())){s+=8;good.push('선호조건: '+w)}});hit(low,strongRisk).forEach(w=>{s-=25;risk.push('강한 회피: '+w)});hit(low,weakRisk).forEach(w=>{s-=13;risk.push('주의: '+w)});arr('avoid').forEach(w=>{if(w&&!risk.join(' ').toLowerCase().includes(w.toLowerCase())&&low.includes(w.toLowerCase())){s-=12;risk.push('회피조건: '+w)}});if(talent){s-=30;risk.push('인재Pool 공고');good.push('관심 회사 저장용')}if(vg.length){let hasFit=sg.length+soft.length+sec.length>0;s-=hasFit?4:12;risk.push(hasFit?'통합공고 확인 필요':'직무 정보 부족')}if(j.section==='워라밸 좋은 회사'){s+=5;good.push('워라밸 섹션')}if(j.section==='조회수 높은 공고'){s+=2;good.push('조회수 높은 공고')}if(j.section==='마감 예정 채용 공고'){s+=3;good.push('마감 임박')}if(!good.length){s-=5;risk.push('추천 근거 부족')}let adv=advice(j,talent,sg,soft,sec,risk,vg,text);return{...j,score:Math.max(0,Math.min(100,s)),good:[...new Set(good)].slice(0,2),risk:[...new Set(risk)].slice(0,2),advice:adv.a,questions:adv.q}}
function bucket(j){if(j.score>=55 && !j.risk.some(r=>/강한 회피|인재Pool|자금/.test(r)))return'오늘 확인';if(j.score<20 || j.risk.some(r=>/강한 회피|경리|아르바이트|세무법인|세무회계사무소|자금/.test(r)))return'제외';return'보관'}
function card(j,i){let b=bucket(j),q=(b==='제외'||!j.questions.length)?'':`<div class="question">확인 질문: ${j.questions.join(' / ')}</div>`;return`<div class="item"><b>${i+1}. ${j.company}</b> · ${j.title}<div class="score">점수 ${j.score}</div><div class="good">이유: ${j.good.length?j.good.join(' / '):'기본 점수'}</div><div class="risk">확인: ${j.risk.length?j.risk.join(' / '):'특이사항 없음'}</div><div class="advice">조언: ${j.advice.join(' ')}</div>${q}</div>`}
function render(){let parsed=parse($('mail').value),jobs=parsed.jobs;if(parsed.notice){$('preview').innerHTML='<p class="risk">'+parsed.notice+'</p>';$('result').innerHTML='사람인 메일로 다시 시도해 주세요.';return}$('preview').innerHTML=jobs.length?`<p><span class="pill">추출 ${jobs.length}개</span><span class="pill">${parsed.platform} / ${parsed.type}</span></p><div class="preview-list">`+jobs.map((j,i)=>`<div class="item"><b>${i+1}. ${j.company}</b> · ${j.title}<div class="meta">${j.section||'-'} / ${j.deadline||'-'}</div></div>`).join('')+'</div>':'공고를 찾지 못했습니다.';let scored=jobs.map(score).sort((a,b)=>b.score-a.score),today=scored.filter(j=>bucket(j)==='오늘 확인').slice(0,7),keep=scored.filter(j=>bucket(j)==='보관').slice(0,7),drop=scored.filter(j=>bucket(j)==='제외').slice(0,7);$('result').innerHTML=`<div class="bucket today"><h3>오늘 확인</h3>${today.length?today.map(card).join(''):'<p class="meta">오늘 바로 볼 공고가 없습니다.</p>'}</div><div class="bucket keep"><h3>보관</h3>${keep.length?keep.map(card).join(''):'<p class="meta">보관할 공고가 없습니다.</p>'}</div><div class="bucket drop"><h3>제외</h3>${drop.length?drop.map(card).join(''):'<p class="meta">제외할 공고가 없습니다.</p>'}</div>`}
$('go').onclick=render;$('sampleSaramin').onclick=()=>{$('mail').value=`김민정님을 위한 추천공고\n마감 예정 채용 공고\n(주)더파운더즈D-6\n재무 계획 및 분석 (FP&A) Sr.매니저\n(주)두꺼비세상D-4\n[두꺼비세상] 재무기획(FP&A)\n세무법인청솔강남지점D-6\n세무법인 세무회계 담당자 경력 채용\n포트로직스(주)D-6\n[CFO 직속] 국내외 자회사 경영관리\n에이스아메리칸화재해상보험(주)D-5\nFP&A Specialist (대리-과장)\n새로 등록된 채용공고\n(주)메디쿼터스D-29\n재무본부: 자금\n(주)이노바인코리아D-26\n회계팀 (육아휴직대체 1년3개월)`;render()};
</script>
</body>
</html>
