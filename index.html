<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobStar 공고 리딩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F7F8FC;color:#1F2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:980px;margin:auto;padding:36px 20px 72px}.hero{background:linear-gradient(135deg,#fff,#EEF3FF);border:1px solid #E5E7EB;border-radius:24px;padding:28px;box-shadow:0 12px 34px rgba(31,41,55,.06)}.card{background:#fff;border:1px solid #E5E7EB;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 10px 24px rgba(31,41,55,.05)}h1{margin:0 0 10px;font-size:32px;letter-spacing:-.03em}h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 10px;font-size:18px}.sub,.meta{color:#6B7280;line-height:1.6}label{display:block;margin-top:10px;color:#374151;font-weight:700;font-size:14px}input,textarea{width:100%;border:1px solid #E5E7EB;background:#fff;color:#1F2937;border-radius:14px;padding:13px 14px;margin:7px 0 12px;font-size:14px}textarea{min-height:230px;resize:vertical;line-height:1.55}button{border:0;border-radius:14px;background:#4F6EF7;color:white;padding:13px 18px;font-weight:800;cursor:pointer;margin:2px}.secondary{background:#EEF3FF;color:#4F6EF7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result-head{background:#EEF3FF;border-radius:20px;padding:18px;margin-bottom:14px}.decision{font-size:24px;font-weight:900;color:#4F6EF7}.score{font-weight:900;color:#4F6EF7}.pill{display:inline-block;border:1px solid #E5E7EB;background:#F7F8FC;border-radius:999px;padding:6px 11px;margin:4px 4px 4px 0;color:#6B7280;font-size:12px}.section{border-radius:20px;padding:16px;margin:14px 0}.good{background:#E8F7EE}.risk{background:#FDEDED}.question{background:#FFF7E8}.reading{background:#F2F4FF}.item{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:13px;margin:9px 0}.small{font-size:13px;color:#6B7280}.empty{color:#6B7280}.footer-note{font-size:13px;color:#6B7280;margin-top:10px}@media(max-width:760px){main{padding:24px 14px 54px}.grid{grid-template-columns:1fr}h1{font-size:27px}.hero,.card{padding:18px;border-radius:18px}}
</style>
</head>
<body>
<main>
<section class="hero"><h1>JobStar 공고 리딩</h1><p class="sub">관심 있는 채용공고 하나를 붙여넣으면, 내 커리어 기준으로 지원할지 말지 가볍게 리딩해드려요.</p></section>
<section class="card"><h2>1) 내 기준</h2><div class="grid"><div><label>끌리는 방향</label><input id="prefer" value="FP&A, 재무기획, 경영관리, 연결회계, 자회사, IR, 공시, 투자, 금융, 핀테크, Finance, Accounting Manager, AI"></div><div><label>피하고 싶은 방향</label><input id="avoid" value="자금, 자금관리, 자금팀, 기장, 종합소득세, 일반전표, 아르바이트, 경리, 일반사무, 총무, 인사, 법무, 계약직"></div></div><label>성향 메모</label><input id="tendency" value="반복업무 소진, 자금업무 비선호, 데이터분석 선호, 시스템개선 선호, 보수조직 주의, 성장산업 선호"><p class="footer-note">지금은 규칙 기반 MVP입니다. 공고 상세내용을 바탕으로 1차 판단을 도와주는 용도예요.</p></section>
<section class="card"><h2>2) 공고 하나 붙여넣기</h2><div class="grid"><div><label>회사명</label><input id="company" placeholder="예: 더파운더즈"></div><div><label>공고명</label><input id="title" placeholder="예: 재무 계획 및 분석(FP&A) Sr.매니저"></div></div><label>상세공고 내용</label><textarea id="content" placeholder="주요업무, 자격요건, 우대사항, 근무조건 등 상세공고 내용을 붙여넣으세요."></textarea><button id="go">이 공고 리딩하기</button><button id="sample" class="secondary">샘플 넣기</button></section>
<section class="card"><h2>3) 리딩 결과</h2><div id="result" class="empty">공고를 입력하고 리딩 버튼을 눌러주세요.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const split=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);
const strongGood=['FP&A','재무기획','경영기획','경영관리','연결회계','자회사','IR','공시','투자','전략','CFO','Finance','Accounting Manager','관리회계','예산','손익','리포트','데이터','분석'];
const softGood=['재무회계','회계팀','재무팀','재무담당','회계 관리자','결산','상장사','내부회계','연결'];
const growthGood=['AI','테크','플랫폼','로보틱스','바이오','핀테크','SaaS','IT','웹툰','콘텐츠'];
const strongRisk=['자금관리','자금 관리','자금팀','자금파트','경리','세무법인','세무회계사무소','세무사무소','기장','종합소득세','일반전표','전표 입력','아르바이트','알바','육아휴직대체'];
const weakRisk=['자금','총무','인사','법무','일반사무','계약직','영업지원','운영지원','CS','물류','AS'];
const vagueRisk=['각 부문','전부문','신입/경력','수시채용','인재Pool','인재풀','인재풀','Talent Pool','포지션 협의'];
function hits(text,list){let low=text.toLowerCase();return list.filter(w=>low.includes(w.toLowerCase()))}
function unique(a){return [...new Set(a)].filter(Boolean)}
function analyze(){let company=$('company').value.trim()||'회사명 미입력',title=$('title').value.trim()||'공고명 미입력',content=$('content').value.trim(),text=[company,title,content].join(' ');let good=[],risk=[],questions=[],score=50;
 let sg=hits(text,strongGood),soft=hits(text,softGood),growth=hits(text,growthGood),sr=hits(text,strongRisk),wr=hits(text,weakRisk),vr=hits(text,vagueRisk);
 sg.forEach(x=>{score+=10;good.push(`${x} 키워드가 있어 기획·분석 업무로 확장될 가능성이 있어요.`)});soft.forEach(x=>{score+=4;good.push(`${x} 경험과 연결될 수 있어요.`)});growth.forEach(x=>{score+=5;good.push(`${x} 산업/회사 힌트가 있어 성장성은 확인해볼 만해요.`)});
 sr.forEach(x=>{score-=15;risk.push(`${x} 키워드는 현재 회피 기준과 강하게 충돌해요.`)});wr.forEach(x=>{score-=8;risk.push(`${x} 업무가 섞이면 우선순위를 낮추는 게 좋아요.`)});vr.forEach(x=>{score-=7;risk.push(`${x} 표현은 실제 담당업무가 불명확할 수 있어요.`)});
 split('prefer').forEach(x=>{if(text.toLowerCase().includes(x.toLowerCase())&&!good.join(' ').toLowerCase().includes(x.toLowerCase())){score+=6;good.push(`${x} 방향과 맞는 단서가 있어요.`)}});
 split('avoid').forEach(x=>{if(text.toLowerCase().includes(x.toLowerCase())&&!risk.join(' ').toLowerCase().includes(x.toLowerCase())){score-=8;risk.push(`${x} 요소가 보여 주의가 필요해요.`)}});
 if(/FP&A|재무기획|경영기획|관리회계|예산|손익|리포트|데이터|분석/i.test(text)){questions.push('이 포지션에서 예산·손익 분석이나 경영진 리포트 업무 비중은 어느 정도인가요?')}
 if(/재무회계|회계팀|결산|전표|세무/i.test(text)){questions.push('월마감·결산·전표 업무와 분석/개선 업무의 비중은 어떻게 나뉘나요?')}
 if(/시스템|자동화|ERP|SAP|데이터|프로세스|개선/i.test(text)){questions.push('기존 재무 프로세스를 개선하거나 자동화할 권한이 있나요?')}
 if(/자금|총무|인사|법무|일반사무/i.test(text)){questions.push('재무 외 업무가 포함된다면 실제 비중은 어느 정도인가요?')}
 if(/인재Pool|인재풀|Talent Pool/i.test(text)){questions.push('현재 실제로 오픈된 포지션인지, 후보자 풀 등록인지 먼저 확인하세요.')}
 if(!content){score-=20;risk.push('상세공고 내용이 없어 제목 기준으로만 판단하고 있어요.');questions.push('상세공고의 주요업무와 자격요건을 추가로 확인하세요.')}
 let tendency=split('tendency').join(' ');if(/반복/.test(tendency)&&/전표|기장|정산|결산|신고|재무회계/.test(text))risk.push('반복업무 소진 성향상 업무 비중 확인이 중요해요.');if(/자금/.test(tendency)&&/자금/.test(text))risk.push('자금업무 비선호 기준과 맞지 않을 수 있어요.');if(/데이터|시스템/.test(tendency)&&/분석|데이터|시스템|자동화|프로세스|FP&A|재무기획/.test(text))good.push('성향 메모상 분석·개선형 업무와 맞을 가능성이 있어요.');
 score=Math.max(0,Math.min(100,score));good=unique(good).slice(0,4);risk=unique(risk).slice(0,4);questions=unique(questions).slice(0,3);if(!good.length)good=['공고 내용만으로는 뚜렷한 장점이 적어 보여요.'];if(!risk.length)risk=['현재 입력 내용 기준으로 큰 위험 신호는 많지 않아요.'];if(!questions.length)questions=['실제 업무가 반복 운영 중심인지, 분석·개선 업무가 포함되는지 확인하세요.'];
 let decision=score>=72?'지원 검토':score>=55?'지원 전 확인':score>=38?'보류':'패스 권장';let type=jobType(text,score);let reading=oneLine(decision,text);render({company,title,score,decision,type,good,risk,questions,reading});}
function jobType(text,score){if(/인재Pool|인재풀|Talent Pool/i.test(text))return'관심회사 저장용';if(/자금|경리|세무법인|기장|아르바이트|총무|인사|법무/.test(text))return'소진 위험 확인형';if(/FP&A|재무기획|경영기획|관리회계|예산|손익/i.test(text))return'분석·기획 확장형';if(/IR|공시|투자|CFO|자회사/.test(text))return'전략·관리 확장형';if(/재무회계|회계팀|결산/.test(text))return'회계경력 연결형';return score>=55?'조건 확인형':'정보 부족형'}
function oneLine(decision,text){if(/인재Pool|인재풀|Talent Pool/i.test(text))return'문은 보이지만 아직 열린 문인지 확인이 필요한 공고예요.';if(/자금|경리|세무법인|기장|아르바이트/.test(text))return'익숙해 보여도 오래 머물수록 지칠 수 있는 자리예요.';if(decision==='지원 검토')return'지금 커리어를 한 칸 넓힐 가능성이 있는 공고예요.';if(decision==='지원 전 확인')return'가능성은 있지만 안쪽 구조를 확인하고 들어가야 하는 자리예요.';if(decision==='보류')return'완전히 나쁘진 않지만 지금 우선순위는 낮춰도 괜찮아요.';return'지금 찾는 방향과는 거리가 있어 보여요.'}
function render(r){$('result').innerHTML=`<div class="result-head"><div class="decision">${r.decision}</div><div class="meta">${r.company} · ${r.title}</div><div class="score">궁합 점수 ${r.score}점</div><span class="pill">${r.type}</span></div><div class="section reading"><h3>커리어 카드</h3><span class="pill">현재 카드: ${r.score>=55?'확장 가능성':'정보 확인'}</span><span class="pill">주의 카드: ${r.risk[0]}</span><span class="pill">결론 카드: ${r.decision}</span><p><b>한 줄 리딩</b><br>${r.reading}</p></div><div class="section good"><h3>좋은 점</h3>${r.good.map(x=>`<div class="item">${x}</div>`).join('')}</div><div class="section risk"><h3>위험 신호</h3>${r.risk.map(x=>`<div class="item">${x}</div>`).join('')}</div><div class="section question"><h3>확인 질문</h3>${r.questions.map(x=>`<div class="item">${x}</div>`).join('')}</div>`}
$('go').onclick=analyze;$('sample').onclick=()=>{$('company').value='더파운더즈';$('title').value='재무 계획 및 분석(FP&A) Sr.매니저';$('content').value='주요업무: 전사 예산 수립, 손익 분석, 경영진 리포트 작성, 사업부별 실적 관리, 데이터 기반 의사결정 지원. 자격요건: 재무기획 또는 회계 경력 5년 이상. 우대사항: 스타트업 또는 커머스 업계 경험, SQL/스프레드시트 활용 능력.';analyze()};
</script>
</body>
</html>
